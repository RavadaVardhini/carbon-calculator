<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoTrack — Weekly Check-in</title>
<style>
  body{
    font-family: 'Inter', sans-serif;
    background:#EEF0E2;
    color:#1B2A20;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    margin:0;
    padding:24px;
  }
  .card{
    background:#FAF9F1;
    border:1px solid #D8D9C7;
    border-radius:8px;
    padding:36px;
    max-width:420px;
    text-align:center;
  }
  h1{ font-size:22px; margin-bottom:12px; }
  p{ color:#4B5A4F; font-size:14px; line-height:1.5; }
  button{
    margin-top:20px;
    background:#2B6F77;
    color:white;
    border:none;
    padding:12px 24px;
    border-radius:5px;
    font-size:15px;
    cursor:pointer;
  }
  button:disabled{ background:#A9CBCF; cursor:default; }
  #status{ margin-top:16px; font-size:13px; color:#4B5A4F; }
</style>
</head>
<body>
<div class="card">
  <h1>EcoTrack Weekly Check-in</h1>
  <p>Turn on notifications to get a quick weekly reminder — just tap Yes, Partially, or No to let us know if you followed your pledge.</p>
  <button id="subscribeBtn">Allow Notifications</button>
  <div id="status"></div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD6Cpb6BgLIzvHva1AV9JMiobjmEpjqCr4",
    authDomain: "ecotrack-292ab.firebaseapp.com",
    projectId: "ecotrack-292ab",
    storageBucket: "ecotrack-292ab.firebasestorage.app",
    messagingSenderId: "540291250147",
    appId: "1:540291250147:web:c2c9693030b6069a9c52d6",
    measurementId: "G-CWLJX95KG3"
  };

  firebase.initializeApp(firebaseConfig);
  const messaging = firebase.messaging();
  const db = firebase.firestore();

  const VAPID_KEY = "BIdPylGJzf_XCPWKf8IxZQIJxm0OLCfgfra0AJHRTAqLxPlI8ho5P0NiFusJsjgE6LXd6qYW30pSrt0jyPItQ2A";

  const btn = document.getElementById('subscribeBtn');
  const status = document.getElementById('status');

  btn.addEventListener('click', async () => {
    status.textContent = "Requesting permission...";
    try {
      const permission = await Notification.requestPermission();
      if (permission !== "granted") {
        status.textContent = "Notifications were not allowed. You can enable them later in your browser settings.";
        return;
      }

      const registration = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
      const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });

      if (token) {
        // Save this device's token so we can send it weekly reminders
        await db.collection('subscribers').doc(token).set({
          token: token,
          subscribedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        status.textContent = "You're all set! You'll get a weekly check-in.";
        btn.disabled = true;
        btn.textContent = "Subscribed ✓";
      } else {
        status.textContent = "Couldn't get a notification token. Try again.";
      }
    } catch (err) {
      console.error(err);
      status.textContent = "Something went wrong: " + err.message;
    }
  });
</script>
</body>
</html>
